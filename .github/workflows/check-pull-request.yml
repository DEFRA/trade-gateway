name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write      
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # NuGet.config expands this at restore time, so no token is ever written to disk
      DEFRA_NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
      - name: Test
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v5
        with:
          dotnet-version: |
            10.0
      - name: Run unit tests
        run: |
          dotnet test --filter "Category!=IntegrationTests"
      - name: Run integration tests
        run: |
          docker compose up -d
          dotnet test --filter "Category=IntegrationTests"
      - name: Docker Compose Logs
        if: always()
        run: |
          docker compose logs
      - name: Check Dockerfile Builds
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: trade-gateway:latest
          build-args: |
            DEFRA_NUGET_PAT=${{ secrets.GITHUB_TOKEN }}
      - name: Check with Trivy
        run: |
          docker run -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --ignore-unfixed \
            --exit-code 1 \
            trade-gateway:latest
      # Tagged with the image name used by trade-gateway-local-environment so the journey tests pick it up
      - name: Save image for journey tests
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          docker tag trade-gateway:latest defradigital/trade-gateway:pr-$PR_NUMBER
          docker save defradigital/trade-gateway:pr-$PR_NUMBER -o trade-gateway.tar
      - name: Upload image for journey tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: trade-gateway-image
          path: trade-gateway.tar
          retention-days: 1
      - name: Pack NuGets
        if: github.actor != 'dependabot[bot]'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "Building a pre-release package for PR #$PR_NUMBER"
          dotnet pack --no-restore --configuration Release -o ./nupkg \
            /p:VersionSuffix="pr-$PR_NUMBER.$BUILD_NUMBER"
      - name: Publish NuGets
        if: github.actor != 'dependabot[bot]'
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate
  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: read
    uses: ./.github/workflows/sonarcloud.yml
    needs: pr-validator
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  journey-tests:
    name: Journey Tests
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
    uses: DEFRA/trade-gateway-journey-tests/.github/workflows/journey-tests.yml@main
    needs: pr-validator
    with:
      image-artifact: trade-gateway-image
      image-variable: TRADE_GATEWAY
      image-tag: pr-${{ github.event.pull_request.number }}

services:
  # floci emulates AWS (SNS, SQS, S3) locally. Topics, queues and buckets are created by
  # compose/scripts/floci/ready.d, including the ones cdp-uploader needs.
  floci:
    image: floci/floci:1.5.25-compat
    env_file:
      - ./compose/config/aws.env
      - ./compose/config/floci.env
    volumes:
      - ./compose/scripts/floci/ready.d:/etc/floci/init/ready.d:ro
    ports:
      - "4566:4566"

  mongodb:
    image: mongo:6.0.28
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 5s
      start_period: 5s
      retries: 3
    ports:
      - "27017:27017"

  # Session store for cdp-uploader.
  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # CDP uploader: malware scans CHED attachments before they reach the trade-gateway-documents
  # bucket. Locally the scan is mocked; a file whose name contains "virus" is rejected.
  # See https://github.com/DEFRA/cdp-uploader
  cdp-uploader:
    image: defradigital/cdp-uploader:${CDP_UPLOADER_VERSION:-latest}
    env_file:
      - ./compose/config/aws.env
      - ./compose/config/cdp-uploader.env
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "7337:7337"

  trade-gateway:
    build:
      args:
        DEFRA_NUGET_PAT: ${DEFRA_NUGET_PAT}
      context: ./
    env_file:
      - ./compose/config/aws.env
      - ./compose/config/trade-gateway.env
      # TracesNT credentials, kept out of source control. See .env.example.
      - path: .env
        required: false
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      cdp-uploader:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3000:8080"
